<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164e63" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#155e75" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="arrowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glowLine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bg2)" stroke="#334155" stroke-width="1.5" />

  <!-- Section Titles -->
  <text x="480" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#f8fafc" text-anchor="middle">OpenFOCI Architecture: Sovereign Biometrics Pipeline</text>
  <text x="480" y="62" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Hardware-first BLE reverse-engineering, zero-cloud dependency, local-first streaming</text>

  <!-- Column 1: Hardware Layer (x=40..300) -->
  <rect x="40" y="90" width="260" height="350" rx="14" fill="url(#box1)" stroke="#6366f1" stroke-width="1.5" />
  <text x="170" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="15" fill="#a5b4fc" text-anchor="middle">1. Physical Hardware</text>
  
  <rect x="60" y="150" width="220" height="60" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="170" y="175" font-family="monospace" font-weight="700" font-size="12" fill="#e0e7ff" text-anchor="middle">Dialog DA14580 SoC</text>
  <text x="170" y="195" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">ARM Cortex-M0 BLE 4.2</text>

  <rect x="60" y="225" width="220" height="60" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="170" y="250" font-family="monospace" font-weight="700" font-size="12" fill="#e0e7ff" text-anchor="middle">Physical Sensors</text>
  <text x="170" y="270" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Diaphragmatic Strain + Accel</text>

  <rect x="60" y="300" width="220" height="60" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="170" y="325" font-family="monospace" font-weight="700" font-size="12" fill="#e0e7ff" text-anchor="middle">Tencent AirSync GATT</text>
  <text x="170" y="345" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">UUID: 0xFEE7 (20-byte MTU)</text>

  <rect x="60" y="375" width="220" height="45" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <text x="170" y="402" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">100% Pogo Pin Charging (No USB)</text>

  <!-- Arrow 1 -> 2 (Luminous, highly visible connecting pipe) -->
  <g>
    <!-- Background Halo Glow -->
    <line x1="300" y1="265" x2="336" y2="265" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.3" filter="url(#glowLine)" />
    <!-- Solid Foreground Line -->
    <line x1="300" y1="265" x2="336" y2="265" stroke="url(#arrowGrad1)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Sharp Arrowhead -->
    <polygon points="334,258 348,265 334,272" fill="#38bdf8" />
    <!-- Flow Badge -->
    <rect x="306" y="240" width="38" height="15" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="0.8" />
    <text x="325" y="251" font-family="monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">BLE</text>
  </g>

  <!-- Column 2: OpenFOCI Core Protocol & Signal Engine (x=350..610) -->
  <rect x="350" y="90" width="260" height="350" rx="14" fill="url(#box2)" stroke="#10b981" stroke-width="1.5" />
  <text x="480" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="15" fill="#6ee7b7" text-anchor="middle">2. OpenFOCI Engine</text>

  <rect x="370" y="150" width="220" height="60" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="480" y="175" font-family="monospace" font-weight="700" font-size="12" fill="#d1fae5" text-anchor="middle">WeChat AirSync Handshake</text>
  <text x="480" y="195" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">AuthReq (0x2711) + CRC32 Init</text>

  <rect x="370" y="225" width="220" height="60" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="480" y="250" font-family="monospace" font-weight="700" font-size="12" fill="#d1fae5" text-anchor="middle">Secret WriteKey Crypto</text>
  <text x="480" y="270" font-family="monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">MD5(uid + 3BF608C70828 + rev_mac)</text>

  <rect x="370" y="300" width="220" height="60" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="480" y="325" font-family="monospace" font-weight="700" font-size="12" fill="#d1fae5" text-anchor="middle">Rolling Breath Analyzer</text>
  <text x="480" y="345" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">10 Hz Peak/Trough, Coherence</text>

  <rect x="370" y="375" width="220" height="45" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="480" y="402" font-family="monospace" font-size="11" fill="#6ee7b7" text-anchor="middle">Cognitive State Classifier</text>

  <!-- Arrow 2 -> 3 (Luminous, highly visible connecting pipe) -->
  <g>
    <!-- Background Halo Glow -->
    <line x1="610" y1="265" x2="646" y2="265" stroke="#34d399" stroke-width="8" stroke-opacity="0.3" filter="url(#glowLine)" />
    <!-- Solid Foreground Line -->
    <line x1="610" y1="265" x2="646" y2="265" stroke="url(#arrowGrad2)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Sharp Arrowhead -->
    <polygon points="644,258 658,265 644,272" fill="#34d399" />
    <!-- Flow Badge -->
    <rect x="616" y="240" width="38" height="15" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="0.8" />
    <text x="635" y="251" font-family="monospace" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">SYNC</text>
  </g>

  <!-- Column 3: Interaction & Storage Surfaces (x=660..920) -->
  <rect x="660" y="90" width="260" height="350" rx="14" fill="url(#box3)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="790" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="15" fill="#67e8f9" text-anchor="middle">3. Open Ecosystem</text>

  <rect x="680" y="150" width="220" height="60" rx="8" fill="#083344" stroke="#0891b2" stroke-width="1" />
  <text x="790" y="175" font-family="monospace" font-weight="700" font-size="12" fill="#cffafe" text-anchor="middle">Mind Orb Web Cockpit</text>
  <text x="790" y="195" font-family="monospace" font-size="10" fill="#a5f3fc" text-anchor="middle">Zero-install HTML5 Canvas + SSE</text>

  <rect x="680" y="225" width="220" height="60" rx="8" fill="#083344" stroke="#0891b2" stroke-width="1" />
  <text x="790" y="250" font-family="monospace" font-weight="700" font-size="12" fill="#cffafe" text-anchor="middle">Pluggable Storage</text>
  <text x="790" y="270" font-family="monospace" font-size="10" fill="#a5f3fc" text-anchor="middle">SQLite, CSV, JSON, Webhooks</text>

  <rect x="680" y="300" width="220" height="60" rx="8" fill="#083344" stroke="#0891b2" stroke-width="1" />
  <text x="790" y="325" font-family="monospace" font-weight="700" font-size="12" fill="#cffafe" text-anchor="middle">Home Assistant &amp; MQTT</text>
  <text x="790" y="345" font-family="monospace" font-size="10" fill="#a5f3fc" text-anchor="middle">Smart home biofeedback automations</text>

  <rect x="680" y="375" width="220" height="45" rx="8" fill="#083344" stroke="#0891b2" stroke-width="1" />
  <text x="790" y="402" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">Fabric OS &amp; AI Agents (SDK)</text>
</svg>
